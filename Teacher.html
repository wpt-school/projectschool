  // ==========================================================
  function togglePp5PanelBody() {
    var bodyEl = document.getElementById('pp5PanelBody');
    if (bodyEl) bodyEl.classList.toggle('hidden');
  }

  function gatherPp5FormConfig() {
    var getVal = function(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : '';
    };
    return {
      targetUrl: getVal('pp5TargetUrl'),
      targetSheetName: getVal('pp5TargetSheet'),
      studentIdCol: getVal('pp5StudentIdCol').toUpperCase(),
      scoreCols: {
        s1: getVal('pp5Col_s1').toUpperCase(),
        s2: getVal('pp5Col_s2').toUpperCase(),
        s3: getVal('pp5Col_s3').toUpperCase(),
        s4: getVal('pp5Col_s4').toUpperCase(),
        s5: getVal('pp5Col_s5').toUpperCase(),
        s6: getVal('pp5Col_s6').toUpperCase(),
        s7: getVal('pp5Col_s7').toUpperCase()
      }
    };
  }

  function applyPp5ConfigToForm(cfg) {
    if (!cfg) return;
    var elUrl = document.getElementById('pp5TargetUrl');
    if (!elUrl) return;
    if (cfg.targetUrl) elUrl.value = cfg.targetUrl;
    if (cfg.targetSheetName !== undefined) document.getElementById('pp5TargetSheet').value = cfg.targetSheetName;
    if (cfg.studentIdCol !== undefined) document.getElementById('pp5StudentIdCol').value = cfg.studentIdCol;
    if (cfg.scoreCols) {
      ['s1', 's2', 's3', 's4', 's5', 's6', 's7'].forEach(function(k) {
        var colInput = document.getElementById('pp5Col_' + k);
        if (colInput && cfg.scoreCols[k] !== undefined) {
          colInput.value = cfg.scoreCols[k];
        }
      });
    }
  }

  function loadSavedPp5ConfigToInputs(showMsg) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.config) {
          applyPp5ConfigToForm(res.config);
          if (showMsg) {
            showPp5StatusAlert('info', '✅ โหลดการตั้งค่าคอลัมน์ที่บันทึกไว้เรียบร้อยแล้ว!');
          }
        } else if (showMsg) {
          showPp5StatusAlert('warning', '⚠️ ยังไม่มีการตั้งค่าคอลัมน์ที่บันทึกไว้ในระบบ');
        }
      })
      .loadPp5ExportConfig();
  }

  function fetchPp5SheetNames() {
    var urlEl = document.getElementById('pp5TargetUrl');
    var url = urlEl ? urlEl.value.trim() : '';
    var btn = document.getElementById('btnFetchSheets');
    var hintEl = document.getElementById('pp5FileTitleHint');
    if (!url) {
      alert('กรุณาวางลิงก์ Google Sheet ปลายทางก่อนครับ');
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '⏳ กำลังดึงชีท...';
    }
    if (hintEl) hintEl.innerHTML = '';

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🔍 ดึงรายชื่อชีท';
        }
        if (res && res.success) {
          if (hintEl) hintEl.innerHTML = '📄 เชื่อมต่อไฟล์: ' + res.spreadsheetName + ' (พบ ' + res.sheetNames.length + ' ชีท)';
          var dataList = document.getElementById('pp5SheetOptionsList');
          if (dataList) {
            dataList.innerHTML = '';
            res.sheetNames.forEach(function(name) {
              var opt = document.createElement('option');
              opt.value = name;
              dataList.appendChild(opt);
            });
          }
          var sheetInput = document.getElementById('pp5TargetSheet');
          if (res.sheetNames.length > 0 && sheetInput && !sheetInput.value) {
            sheetInput.value = res.sheetNames[0];
          }
        } else {
          alert(res ? res.message : 'ไม่สามารถดึงรายชื่อชีทได้');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🔍 ดึงรายชื่อชีท';
        }
        alert('เกิดข้อผิดพลาด: ' + err.message);
      })
      .getTargetSpreadsheetSheets(url);
  }

  function savePp5ConfigOnly() {

  function executePp5ScoreExport() {
    var cfg = gatherPp5FormConfig();
    if (!cfg.targetUrl) {
      showPp5StatusAlert('warning', '⚠️ กรุณาระบุลิงก์ของ Google Sheet ปลายทางก่อนครับ');
      return;
    }
    if (!cfg.targetSheetName) {
      showPp5StatusAlert('warning', '⚠️ กรุณาระบุชื่อชีทที่ต้องการใส่คะแนนก่อนครับ');
      return;
    }
    if (!cfg.studentIdCol) {
      showPp5StatusAlert('warning', '⚠️ กรุณาระบุคอลัมน์สำหรับตรวจสอบเลขประจำตัวนักเรียนก่อนครับ');
      return;
    }

    var btn = document.getElementById('btnRunPp5Export');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '⏳ กำลังตรวจสอบสมาชิกกลุ่มและส่งคะแนนไป ปพ.5...';
    }
    showPp5StatusAlert('secondary', '⏳ กำลังประมวลผล: ตรวจสอบคะแนนจาก GroupScores ➔ ค้นหาสมาชิกในชีท Groups ➔ บันทึกลงชีท "' + cfg.targetSheetName + '"...');

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🚀 ส่งคะแนนไปยังไฟล์ ปพ.5 ทันที';
        }
        if (res && res.success) {
          var detailHtml = '<div class="fw-bold mb-1">' + res.message + '</div>';
          if (res.matchedDetails && res.matchedDetails.length > 0) {
            detailHtml += '<div class="small mt-2" style="max-height:180px; overflow-y:auto; background:#ffffff; padding:10px; border-radius:8px; border:1px solid #cbd5e1;">';
            detailHtml += '<b>รายชื่อนักเรียนที่อัปเดตคะแนนสำเร็จ (' + res.matchedDetails.length + ' คน):</b><ul class="mb-0 mt-1">';
            res.matchedDetails.forEach(function(item) {
              var scoreStrs = Object.keys(item.scores).map(function(k) {
                return k.toUpperCase() + '=' + item.scores[k];
              }).join(', ');
              detailHtml += '<li>แถวที่ ' + item.rowNumber + ' | รหัสนักเรียน: <b>' + item.studentId + '</b> (' + item.groupName + ') ➔ [' + scoreStrs + ']</li>';
            });
            detailHtml += '</ul></div>';
          } else {
            detailHtml += '<div class="small text-danger mt-1">⚠️ ไม่พบเลขประจำตัวนักเรียนที่ตรงกันในชีท "' + cfg.targetSheetName + '" คอลัมน์ ' + cfg.studentIdCol + ' (หรือกลุ่มของนักเรียนในห้องนี้ยังไม่มีคะแนนในชีท GroupScores)</div>';
          }
          showPp5StatusAlert('success', detailHtml);
        } else {
          showPp5StatusAlert('danger', res ? res.message : 'ไม่สามารถส่งคะแนนได้');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🚀 ส่งคะแนนไปยังไฟล์ ปพ.5 ทันที';
        }
        showPp5StatusAlert('danger', 'เกิดข้อผิดพลาด: ' + err.message);
      })
      .exportScoresToPp5(cfg);
  }

  function buildTeacherParagraphPrefix(p) {
    if (!p || !p.refType || p.refType === 'none') return '';
    var authorStr = '';
    var yearStr = '';
    if (p.refType === 'book') {
      var count = p.bookAuthorCount || '1';
      var a1 = (p.bookAuthors && p.bookAuthors[0]) ? p.bookAuthors[0] : { firstName: '', lastName: '' };
      var full1 = ((a1.firstName || '').trim() + ' ' + (a1.lastName || '').trim()).trim() || '-';
      if (count === '1') authorStr = full1;
      else if (count === '2') {
        var a2 = (p.bookAuthors && p.bookAuthors[1]) ? p.bookAuthors[1] : { firstName: '', lastName: '' };
        var full2 = ((a2.firstName || '').trim() + ' ' + (a2.lastName || '').trim()).trim() || '-';
        authorStr = full1 + ' และ ' + full2;
      } else authorStr = full1 + ' และคณะ';
      yearStr = (p.bookYearType === 'no_year') ? 'ม.ป.ป.' : ((p.bookYear || '').trim() || '-');
    } else if (p.refType === 'website') {
      authorStr = (p.webHasAuthor === 'no') ? ((p.webArticleTitleAlt || '').trim() || '-') : (((p.webAuthorFirstName || '').trim() + ' ' + (p.webAuthorLastName || '').trim()).trim() || '-');
      yearStr = (p.webYearType === 'no_year') ? 'ม.ป.ป.' : ((p.webYear || '').trim() || '-');
    }
    return authorStr + ', (' + yearStr + ')';
  }

  function buildTeacherResearchAuthor(rObj) {
    var count = rObj.authorCount || '1';
    var a1 = (rObj.authors && rObj.authors[0]) ? rObj.authors[0] : { firstName: '', lastName: '' };
    var full1 = ((a1.firstName || '').trim() + ' ' + (a1.lastName || '').trim()).trim() || '-';
    if (count === '1') return full1;
    if (count === '2') {
      var a2 = (rObj.authors && rObj.authors[1]) ? rObj.authors[1] : { firstName: '', lastName: '' };
      var full2 = ((a2.firstName || '').trim() + ' ' + (a2.lastName || '').trim()).trim() || '-';
      return full1 + ' และ ' + full2;
    }
    return full1 + ' และคณะ';
  }

  function buildTeacherResearchAPA7(rObj) {
    var authorStr = buildTeacherResearchAuthor(rObj);
    var yearStr = (rObj.yearType === 'no_year') ? 'ม.ป.ป.' : ((rObj.year || '').trim() || '-');
    var docType = rObj.docType || 'project';
    if (docType === 'project') {
      return escapeHtml(authorStr) + '. (' + escapeHtml(yearStr) + '). <i>' + escapeHtml(rObj.projectTitle || '-') + '</i> [' + escapeHtml(rObj.projectLevel || '-') + ']. ' + escapeHtml(rObj.projectInstitute || '-') + '.';
    }
    if (docType === 'research_report') {
      return escapeHtml(authorStr) + '. (' + escapeHtml(yearStr) + '). <i>' + escapeHtml(rObj.reportTitle || '-') + '</i> (' + escapeHtml(rObj.reportType || 'รายงานผลการวิจัย') + '). ' + escapeHtml(rObj.reportAgency || '-') + '.';
    }
    if (docType === 'thesis') {
      var dbPart = rObj.thesisDatabase ? (' ' + escapeHtml(rObj.thesisDatabase) + '.') : '';
      return escapeHtml(authorStr) + '. (' + escapeHtml(yearStr) + '). <i>' + escapeHtml(rObj.thesisTitle || '-') + '</i> [' + escapeHtml(rObj.thesisDegreeType || '-') + ', ' + escapeHtml(rObj.thesisUniversity || '-') + '].' + dbPart;
    }
    if (docType === 'article') {
      return escapeHtml(authorStr) + '. (' + escapeHtml(yearStr) + '). ' + escapeHtml(rObj.articleTitle || '-') + '. ใน <i>' + escapeHtml(rObj.articleReportName || '-') + '</i> (น. ' + escapeHtml(rObj.articlePageStart || '-') + '–' + escapeHtml(rObj.articlePageEnd || '-') + '). ' + escapeHtml(rObj.articlePublisher || '-') + '.';
    }
    return '';
  }

  function formatStepContentForTeacher(stepNum, data, projectTitle) {
    if (!data || Object.keys(data).length === 0) {
      return '<div class="text-muted fst-italic">ยังไม่มีข้อมูลที่บันทึกในขั้นตอนนี้</div>';

    if (stepNum === 1) {
      var advisors = (data.advisors && data.advisors.length > 0) ? data.advisors.join(', ') : '-';
      return '<div><strong>1) ชื่อโครงงานอาชีพ:</strong> <span class="text-primary fw-bold">' + escapeHtml(data.projectTitle || '-') + '</span></div>' +

      var objs = (data.objectives && data.objectives.length > 0) 
        ? data.objectives.map(function(o, i) { return '<div>' + (i + 1) + '. ' + escapeHtml(o) + '</div>'; }).join('') : '-';
      var bens = (data.benefits && data.benefits.length > 0) 
        ? data.benefits.map(function(b, i) { return '<div>' + (i + 1) + '. ' + escapeHtml(b) + '</div>'; }).join('') : '-';
      return '<div class="mb-2"><strong>1) ที่มาและความสำคัญของโครงงาน:</strong><br><div class="ps-2 border-start border-2 mt-1" style="white-space: pre-wrap;">' + escapeHtml(data.background || '-') + '</div></div>' +
             '<div class="mb-2"><strong>2) วัตถุประสงค์ของโครงงาน:</strong><div class="ps-3">' + objs + '</div></div>' +
             '<div class="mb-2"><strong>3) ขอบเขตของโครงงาน:</strong>' +
               '<ul class="mb-1">' +
                 '<li><strong>3.1 ด้านผลิตภัณฑ์:</strong> ' + escapeHtml(data.scopeProduct || '-') + '</li>' +
                 '<li><strong>3.2 ด้านการผลิต:</strong> ' + escapeHtml(data.scopeProduction || '-') + '</li>' +
                 '<li><strong>3.3 ด้านการตลาดและกลุ่มเป้าหมาย:</strong> ' + escapeHtml(data.scopeMarket || '-') + '</li>' +

    }

    if (stepNum === 3) {
      var theories = data.theories || [];
      var researches = data.researches || [];

      var thHtml = theories.map(function(th, idx) {
        var pHtml = (th.paragraphs || []).map(function(p, pIdx) {
          var prefix = buildTeacherParagraphPrefix(p);
          var prefixSpan = prefix ? ('<strong class="text-primary">' + escapeHtml(prefix) + '</strong> ') : '';
          return '<div class="mb-2 ps-2 border-start border-primary border-2"><em>ย่อหน้าที่ ' + (pIdx + 1) + ':</em> ' + prefixSpan + escapeHtml(p.text || '-') + '</div>';
        }).join('');
        return '<div class="p-2 mb-2 bg-white rounded border">' +
                 '<div class="fw-bold text-success">สาระสำคัญที่ ' + (idx + 1) + ': ' + escapeHtml(th.topic || '-') + '</div>' +
                 '<div class="mt-1">' + pHtml + '</div>' +

               '</div>';

      var resHtml = researches.map(function(r, rIdx) {
        var authorStr = buildTeacherResearchAuthor(r);

               '</div>';
      }).join('');

      return '<div class="mb-3"><strong class="text-success">ส่วนที่ 1: ทฤษฎีหรือแนวคิดที่เกี่ยวข้อง</strong><div class="mt-1">' + (thHtml || '-') + '</div></div>' +
             '<div class="mb-3"><strong class="text-primary">ส่วนที่ 2: งานวิจัยและโครงงานที่เกี่ยวข้อง</strong><div class="mt-1">' + (resHtml || '-') + '</div></div>' +

      return '<div class="mb-3"><strong class="text-success">1. ขั้นตอนการดำเนินงานตามขั้นตอนการทำงาน:</strong><div class="mt-2">' + (workStepsHtml || '-') + '</div></div>' +

                 '<li><strong>4) ราคาที่จัดจำหน่าย:</strong> ' + escapeHtml(data.sellingPrice || '-') + ' บาท</li>' +
                 '<li><strong>5) กำไรต่อชิ้น:</strong> ' + escapeHtml(data.profitPerUnit || 0) + ' บาท</li>' +

             '<div class="mb-3 p-2 bg-white rounded border">' +
               '<strong class="text-success">1) ผลการดำเนินงานตามวัตถุประสงค์:</strong>' +
               '<div class="small text-secondary mb-2">คณะผู้จัดทำโครงงานอาชีพ เรื่อง <b>' + escapeHtml(projectTitle || '-') + '</b> มีผลการดำเนินงานตามวัตถุประสงค์ ดังต่อไปนี้</div>' +
               '<div class="ps-2">' + (objResHtml || '-') + '</div>' +
             '</div>' +
             '<div class="mb-3 p-2 bg-white rounded border">' +
               '<strong class="text-success">2) ปัญหาและอุปสรรค:</strong>' +
               '<div class="small text-secondary mb-1">คณะผู้จัดทำโครงงานอาชีพ เรื่อง <b>' + escapeHtml(projectTitle || '-') + '</b> ในระหว่างดำเนินโครงงาน คณะผู้จัดทำได้พบปัญหาและอุปสรรคต่อการดำเนินงาน ดังต่อไปนี้</div>' +

    if (stepNum === 7) {

      var appHtml = (data.appendixItems || []).map(function(item, idx) {

                 imgTag +

      return '<div class="mb-3 p-3 bg-white rounded border">' +

    if (stepNum === 8) {

          : '<div class="text-muted small border rounded p-3 d-inline-block bg-light">ไม่มีรูปถ่าย</div>';

        return '<div class="p-3 mb-2 bg-white border rounded shadow-sm">' +
                 '<div class="d-flex gap-3 align-items-start flex-wrap">' +
                   '<div>' + photoTag + '</div>' +
                   '<div class="flex-grow-1">' +
                     '<div class="fw-bold text-success fs-6">' + (idx + 1) + '. ชื่อ - นามสกุล: ' + escapeHtml(mp.fullName || '-') + '</div>' +
                     '<div><strong>วัน เดือน ปีเกิด:</strong> ' + escapeHtml(mp.dob || '-') + '</div>' +
                     '<div><strong>ที่อยู่:</strong> บ้านเลขที่ ' + escapeHtml(addr.houseNo || '-') + ' หมู่ที่ ' + escapeHtml(addr.moo || '-') + ' หมู่บ้าน' + escapeHtml(addr.village || '-') + ' ตำบล' + escapeHtml(addr.subDistrict || '-') + ' อำเภอ' + escapeHtml(addr.district || '-') + ' จังหวัด' + escapeHtml(addr.province || '-') + ' รหัสไปรษณีย์ ' + escapeHtml(addr.postalCode || '-') + '</div>' +
                     '<div class="mt-1"><strong>ประวัติการศึกษา:</strong>' +
                       '<ul class="mb-1 small">' +
                         '<li><strong>ระดับประถมศึกษา:</strong> ' + escapeHtml(pEdu.schoolName || '-') + ' อำเภอ' + escapeHtml(pEdu.district || '-') + ' จังหวัด' + escapeHtml(pEdu.province || '-') + '</li>' +
                         '<li><strong>ระดับมัธยมศึกษาตอนต้น:</strong> ' + escapeHtml(jEdu.schoolName || '-') + ' อำเภอ' + escapeHtml(jEdu.district || '-') + ' จังหวัด' + escapeHtml(jEdu.province || '-') + '</li>' +
                         '<li><strong>ปัจจุบัน กำลังศึกษาอยู่ระดับมัธยมศึกษาตอนปลาย:</strong> ' + escapeHtml(sEdu.schoolName || '-') + ' อำเภอ' + escapeHtml(sEdu.district || '-') + ' จังหวัด' + escapeHtml(sEdu.province || '-') + '</li>' +

    return '<div style="white-space: pre-wrap;">' + escapeHtml(data.content || JSON.stringify(data, null, 2)) + '</div>';

  function toggleStepContentViewer(groupId, stepNum) {
    var viewer = document.getElementById('stepViewer_' + groupId + '_' + stepNum);
    if (viewer) viewer.classList.toggle('hidden');
  }

  function toggleAllStepsForGroup(groupId) {
    var viewers = document.querySelectorAll('.group-viewer-' + groupId);
    var anyHidden = Array.from(viewers).some(function(el) { return el.classList.contains('hidden'); });
    viewers.forEach(function(el) {
      if (anyHidden) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });
  }

  function loadDashboard() {
    hideTeacherAlert();
    var container = document.getElementById('groupsListContainer');
    if (!container) return;
    container.innerHTML = '<div class="text-center py-5">กำลังโหลดข้อมูลกลุ่มโครงงานและคะแนน (ปุ่มที่ 1 ถึง ปุ่มที่ 8)...</div>';

    google.script.run.withSuccessHandler(function(res) {
      if (!res.success) {
        showTeacherAlert(res.message, 'danger');
        return;
      }
      renderTeacherData(res);
    }).withFailureHandler(function(err) {
      showTeacherAlert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + (err.message || err), 'danger');
    }).getTeacherDashboardData();
  }

  function renderTeacherData(res) {
    var c = res.criteria || {};
    var elC1 = document.getElementById('c_criteria_1');
    if (!elC1) return;

    elC1.value = c.criteria_1 || '';
    document.getElementById('c_criteria_2').value = c.criteria_2 || '';

  function submitSaveCriteria() {
    hideTeacherAlert();
    var btn = document.getElementById('saveCriteriaBtn');
    btn.disabled = true;
    btn.innerText = 'กำลังบันทึกเกณฑ์...';

    var payload = {
      criteria_1: document.getElementById('c_criteria_1').value,
      criteria_2: document.getElementById('c_criteria_2').value,
      criteria_3: document.getElementById('c_criteria_3').value,
      criteria_7: document.getElementById('c_criteria_7').value,
      gemini_api_key: document.getElementById('c_gemini_key').value
    };

    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerText = '💾 บันทึกเกณฑ์การตรวจให้คะแนน';
      if (res.success) showTeacherAlert(res.message, 'success');
      else showTeacherAlert(res.message, 'danger');

  }

  function submitStepDecision(groupId, stepNum, decision) {
    hideTeacherAlert();
    var comment = document.getElementById('tComment_' + groupId + '_' + stepNum).value;
    google.script.run.withSuccessHandler(function(res) {
      if (res.success) {
        showTeacherAlert('อัปเดตสถานะปุ่มที่ ' + stepNum + ' เรียบร้อยแล้ว!', 'success');
        renderTeacherData(res);
      } else {
        showTeacherAlert(res.message, 'danger');
      }
    }).teacherReviewStep(groupId, stepNum, decision, comment);
  }

  function submitManualScores(groupId, groupName) {
    hideTeacherAlert();
    var s4 = document.getElementById('mScore4_' + groupId).value;
    var s5 = document.getElementById('mScore5_' + groupId).value;
    var s6 = document.getElementById('mScore6_' + groupId).value;

    google.script.run.withSuccessHandler(function(res) {
      if (res.success) {
        showTeacherAlert(res.message, 'success');

      } else {
        showTeacherAlert(res.message, 'danger');

  // ==========================================================
  // ตัวแปรควบคุมจังหวะการกดตรวจด้วย AI (ปรับเปลี่ยนได้)
  // ==========================================================
  var AI_COOLDOWN_SECONDS = 5;    // เวลาหน่วงปลอดภัยหลังตรวจเสร็จแต่ละครั้ง (หน่วย: วินาที)
  window.isAnyAIProcessing = false;

  /**
   * ล็อกหรือปลดล็อกปุ่ม AI ทั้งหมดบนหน้าจอ เพื่อป้องกันการกดซ้อนกันระหว่างรอผล
   */
  function setAllAIButtonsDisabled_(isDisabled) {
    var btns = document.querySelectorAll('.ai-score-box button, [id^="btnAiStep_"]');
    btns.forEach(function(b) {
      b.disabled = isDisabled;
    });
  }

  /**
   * นับถอยหลังระยะปลอดภัยก่อนปลดล็อกให้กดตรวจครั้งถัดไป
   */
  function startAICooldown_(seconds, doneMsg) {
    var remaining = seconds;
    var timer = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        window.isAnyAIProcessing = false;
        setAllAIButtonsDisabled_(false);
        if (doneMsg) {
          showTeacherAlert(doneMsg, 'info');
        }
      }
    }, 1000);
  }

  function triggerAIGrade(groupId, groupName, assessmentNum) {
    if (window.isAnyAIProcessing) {
      showTeacherAlert('⏳ กรุณารอให้ AI ตรวจรอบก่อนหน้าและพักคูลดาวน์ให้เสร็จก่อนครับ เพื่อความแม่นยำของคะแนน', 'warning');
      return;
    }

    window.isAnyAIProcessing = true;
    setAllAIButtonsDisabled_(true);
    hideTeacherAlert();
    showTeacherAlert('⏳ กำลังให้ Gemini AI ตรวจให้คะแนนครั้งที่ ' + assessmentNum + ' ของกลุ่ม ' + groupName + ' (กรุณารอสักครู่)...', 'info');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          showTeacherAlert(res.message + ' | พักระบบ ' + AI_COOLDOWN_SECONDS + ' วินาทีก่อนตรวจครั้งถัดไป...', 'success');
          renderTeacherData(res.dashboard);
          setAllAIButtonsDisabled_(true); // คงสถานะล็อกปุ่มต่อจนกว่าจะครบคูลดาวน์
          startAICooldown_(AI_COOLDOWN_SECONDS, '✅ พร้อมกดตรวจงานด้วย AI ในครั้งถัดไปได้แล้วครับ');
        } else {
          window.isAnyAIProcessing = false;
          setAllAIButtonsDisabled_(false);
          showTeacherAlert(res ? res.message : 'ไม่สามารถตรวจให้คะแนนได้', 'danger');
        }
      })
      .withFailureHandler(function(err) {
        window.isAnyAIProcessing = false;
        setAllAIButtonsDisabled_(false);
        showTeacherAlert('เกิดข้อผิดพลาดในการตรวจให้คะแนน: ' + (err.message || err), 'danger');
      })
      .runAIGradingForGroup(groupId, groupName, assessmentNum);
  }

  function triggerAIStepInspect(groupId, stepNum) {
    if (window.isAnyAIProcessing) {
      showTeacherAlert('⏳ กรุณารอให้ AI ตรวจปุ่มก่อนหน้าให้เสร็จสมบูรณ์ก่อนครับ', 'warning');
      return;
    }

    window.isAnyAIProcessing = true;
    setAllAIButtonsDisabled_(true);

    var btn = document.getElementById('btnAiStep_' + groupId + '_' + stepNum);
    var commentInput = document.getElementById('tComment_' + groupId + '_' + stepNum);
    if (btn) btn.innerHTML = '⏳ กำลังตรวจ...';
    if (commentInput) {
      commentInput.value = '⏳ กำลังให้ Gemini AI วิเคราะห์เนื้อหาปุ่มที่ ' + stepNum + '...';
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) btn.innerHTML = '🤖 AI ตรวจปุ่มที่ ' + stepNum;
        if (res && res.success) {
          if (commentInput) {
            commentInput.value = res.comment || '';
            commentInput.setAttribute('data-ai-unsaved', 'true'); // ป้องกัน Auto-Sync ล้างข้อความนี้ทิ้ง
            commentInput.style.backgroundColor = res.passed ? '#e8f5e9' : '#fff3cd';
          }
          showTeacherAlert(res.comment + ' (กรุณากดอนุมัติหรือส่งกลับแก้ไขเพื่อบันทึกข้อความนี้)', res.passed ? 'success' : 'warning');
          startAICooldown_(3, ''); // พัก 3 วินาทีสำหรับปุ่มตรวจคัดกรองรายปุ่ม
        } else {
          window.isAnyAIProcessing = false;
          setAllAIButtonsDisabled_(false);
          if (commentInput) commentInput.value = '';
          showTeacherAlert(res ? res.message : 'ไม่สามารถตรวจได้', 'danger');
        }
      })
      .withFailureHandler(function(err) {
        window.isAnyAIProcessing = false;
        setAllAIButtonsDisabled_(false);
        if (btn) btn.innerHTML = '🤖 AI ตรวจปุ่มที่ ' + stepNum;
        if (commentInput) commentInput.value = '';
        showTeacherAlert('เกิดข้อผิดพลาด: ' + (err.message || err), 'danger');
      })
      .inspectStepWithAI(groupId, stepNum);
  }

  // =====================================================================
  // ระบบซิงค์ข้อมูลอัตโนมัติ (Auto-Sync) + เรียงกลุ่มรอตรวจไว้บนสุด + จำสถานะหน้าจอ
  // =====================================================================
  (function() {
    var cachedDashboardResponse = null;
    var lastDataSignature = '';
    var selectedTeacherRoom = 'ALL';
    var selectedStatusFilter = 'ALL';
    var autoSyncIntervalSec = 30;
    var autoSyncTimerId = null;
    var isSilentRefreshing = false;

    function computeGroupsSignature(groupsList) {
      if (!groupsList || !Array.isArray(groupsList)) return '';
      return JSON.stringify(groupsList.map(function(g) {
        return {
          id: g.groupId,
          title: g.projectTitle,
          mCount: (g.members || []).length,
          steps: g.progress ? g.progress.steps : {},
          comments: g.progress ? g.progress.comments : {},
          scores: g.scores || {}
        };
      }));
    }

    function captureCurrentUIState() {
      var state = {
        scrollY: window.scrollY || window.pageYOffset || 0,
        openViewers: {},
        inputValues: {},
        aiUnsavedInputs: {}
      };

      var viewers = document.querySelectorAll('.student-content-viewer');
      viewers.forEach(function(el) {
        if (el.id && !el.classList.contains('hidden')) {
          state.openViewers[el.id] = true;
        }
      });

      var inputs = document.querySelectorAll('#groupsListContainer input');
      inputs.forEach(function(inp) {
        if (inp.id) {
          state.inputValues[inp.id] = inp.value;
          if (inp.getAttribute('data-ai-unsaved') === 'true') {
            state.aiUnsavedInputs[inp.id] = inp.value;
          }
        }
      });

      return state;
    }

    function restoreCurrentUIState(state, preserveScroll) {
      if (!state) return;

      Object.keys(state.openViewers).forEach(function(viewerId) {
        var el = document.getElementById(viewerId);
        if (el) el.classList.remove('hidden');
      });

      Object.keys(state.inputValues).forEach(function(inputId) {
        var inp = document.getElementById(inputId);
        if (!inp) return;
        if (document.activeElement === inp || state.aiUnsavedInputs[inputId] !== undefined) {
          inp.value = state.inputValues[inputId];
          if (state.aiUnsavedInputs[inputId] !== undefined) {
            inp.setAttribute('data-ai-unsaved', 'true');
          }
        }
      });

      if (preserveScroll) {
        window.scrollTo({ top: state.scrollY, behavior: 'instant' });
      }
    }

    function isTeacherActivelyTyping() {
      var activeEl = document.activeElement;
      if (!activeEl) return false;
      var container = document.getElementById('groupsListContainer');
      if (container && container.contains(activeEl)) {
        var tag = activeEl.tagName;
        return (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
      }
      return false;
    }

    /**
     * ค้นหาหมายเลขปุ่ม (1 ถึง 8) ที่มีสถานะเป็น 'รอครูตรวจสอบ' (แก้ไขข้อผิดพลาด ReferenceError เรียบร้อยแล้ว)
     */
    function getPendingStepNumbers(groupObj) {
      var pendingList = [];
      var steps = (groupObj && groupObj.progress && groupObj.progress.steps) ? groupObj.progress.steps : {};
      for (var s = 1; s <= TOTAL_TEACHER_STEPS; s++) {
        var st = steps[s] || {};
        if (String(st.status || '').trim() === 'รอครูตรวจสอบ') {
          pendingList.push(s);
        }
      }
      return pendingList;
    }

    function getGroupSortPriority(groupObj) {
      var pendingSteps = getPendingStepNumbers(groupObj);
      if (pendingSteps.length > 0) return 0;

      var steps = (groupObj && groupObj.progress && groupObj.progress.steps) ? groupObj.progress.steps : {};
      var allApproved = true;
      for (var s = 1; s <= TOTAL_TEACHER_STEPS; s++) {
        var st = steps[s] || { status: 'ล็อก' };
        if (String(st.status || '').trim() !== 'อนุมัติแล้ว') {
          allApproved = false;
          break;
        }
      }
      return allApproved ? 2 : 1;
    }

    function updateSyncStatusText(text, isHighlight) {
      var syncEl = document.getElementById('teacherAutoSyncStatus');
      if (syncEl) {
        syncEl.innerText = text;
        syncEl.className = isHighlight ? 'small fw-bold text-primary' : 'small text-muted';
      }
    }

    function formatTimeNow() {
      var d = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      var ss = String(d.getSeconds()).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;
    }

    window.silentRefreshTeacherDashboard = function(forceRender) {
      if (isSilentRefreshing) return;
      if (window.isAnyAIProcessing) return; // พัก Auto-Sync ชั่วคราวระหว่าง AI กำลังตรวจงาน
      var container = document.getElementById('groupsListContainer');
      if (!container) return;

      if (!forceRender && isTeacherActivelyTyping()) {
        updateSyncStatusText('⏸️ ชะลอการซิงค์ชั่วคราว (กำลังพิมพ์ข้อมูล...)', false);
        return;
      }

      isSilentRefreshing = true;
      updateSyncStatusText('🔄 กำลังซิงค์ข้อมูลล่าสุดอัตโนมัติ...', true);

      google.script.run
        .withSuccessHandler(function(res) {
          isSilentRefreshing = false;
          if (!res || !res.success) {
            updateSyncStatusText('⚠️ ซิงค์ไม่สำเร็จเมื่อ ' + formatTimeNow(), false);
            return;
          }

          var newSig = computeGroupsSignature(res.groups);
          if (forceRender || newSig !== lastDataSignature) {
            lastDataSignature = newSig;
            window.renderTeacherData(res, true);
            updateSyncStatusText('✅ พบข้อมูลใหม่! อัปเดตอัตโนมัติเมื่อ ' + formatTimeNow(), true);
          } else {
            updateSyncStatusText('⚡ ข้อมูลเป็นปัจจุบันแล้ว (เช็กล่าสุด ' + formatTimeNow() + ')', false);
          }
        })
        .withFailureHandler(function() {
          isSilentRefreshing = false;
          updateSyncStatusText('⚠️ การเชื่อมต่อขัดข้องเมื่อ ' + formatTimeNow(), false);
        })
        .getTeacherDashboardData();
    };

    function restartAutoSyncTimer() {
      if (autoSyncTimerId) {
        clearInterval(autoSyncTimerId);
        autoSyncTimerId = null;
      }
      if (autoSyncIntervalSec > 0) {
        autoSyncTimerId = setInterval(function() {
          if (!document.hidden && document.getElementById('groupsListContainer')) {
            window.silentRefreshTeacherDashboard(false);
          }
        }, autoSyncIntervalSec * 1000);
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && autoSyncIntervalSec > 0 && document.getElementById('groupsListContainer')) {
        window.silentRefreshTeacherDashboard(false);
      }
    });

    window.showTeacherAlert = function(msg, type) {
      type = type || 'success';
      var box = document.getElementById('teacherAlert');
      if (box) {
        box.className = 'alert alert-' + type + ' shadow-sm';
        box.innerText = msg;
        box.classList.remove('hidden');
      }

      var toast = document.getElementById('teacherFloatingToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'teacherFloatingToast';
        toast.style.cssText = 'position:fixed; bottom:24px; right:24px; z-index:9999; max-width:420px; transition:opacity 0.3s;';
        document.body.appendChild(toast);
      }
      toast.innerHTML = '<div class="alert alert-' + type + ' shadow-lg border-2 fw-bold m-0 py-3 px-4">' + escapeHtml(msg) + '</div>';
      toast.style.opacity = '1';
      toast.style.display = 'block';

      if (window.__teacherToastTimer) clearTimeout(window.__teacherToastTimer);
      window.__teacherToastTimer = setTimeout(function() {
        if (toast) toast.style.display = 'none';
      }, 4500);
    };

    var originalRenderTeacherData = window.renderTeacherData;
    if (typeof originalRenderTeacherData === 'function') {
      window.renderTeacherData = function(res, keepScrollPosition) {
        var savedUI = captureCurrentUIState();

        if (res && res.groups) {
          cachedDashboardResponse = res;
          lastDataSignature = computeGroupsSignature(res.groups);
        }
        if (!cachedDashboardResponse) return;

        var container = document.getElementById('groupsListContainer');
        if (container && !document.getElementById('teacherRoomFilterBar')) {
          var filterBar = document.createElement('div');
          filterBar.id = 'teacherRoomFilterBar';
          filterBar.className = 'card p-3 mb-3 shadow-sm border-success bg-white';
          filterBar.innerHTML =
            '<div class="row g-2 align-items-center">' +
              '<div class="col-12 col-md-4">' +
                '<label class="form-label small fw-bold text-success mb-1">🏫 เลือกห้องเรียน:</label>' +
                '<select id="teacherRoomSelect" class="form-select fw-bold" onchange="onTeacherRoomFilterChange(this.value)"></select>' +
              '</div>' +
              '<div class="col-12 col-md-4">' +
                '<label class="form-label small fw-bold text-primary mb-1">🔔 ตัวกรองสถานะการตรวจ:</label>' +
                '<select id="teacherStatusSelect" class="form-select fw-bold" onchange="onTeacherStatusFilterChange(this.value)">' +
                  '<option value="ALL">📋 แสดงทุกกลุ่ม (นำกลุ่มรอตรวจไว้บนสุด)</option>' +
                  '<option value="PENDING_ONLY">⏳ แสดงเฉพาะกลุ่มที่ "รอครูตรวจสอบ"</option>' +
                '</select>' +
              '</div>' +
              '<div class="col-12 col-md-4">' +
                '<label class="form-label small fw-bold text-secondary mb-1">⚡ ซิงค์ข้อมูลอัตโนมัติ (ไม่ต้องกดโหลดเอง):</label>' +
                '<div class="input-group">' +
                  '<select id="teacherAutoSyncSelect" class="form-select fw-bold" onchange="onTeacherAutoSyncChange(this.value)">' +
                    '<option value="15">ทุก 15 วินาที</option>' +
                    '<option value="30" selected>ทุก 30 วินาที (แนะนำ)</option>' +
                    '<option value="60">ทุก 1 นาที</option>' +
                    '<option value="0">ปิดการซิงค์อัตโนมัติ</option>' +
                  '</select>' +
                  '<button type="button" class="btn btn-outline-success fw-bold" onclick="silentRefreshTeacherDashboard(true)" title="ซิงค์เดี๋ยวนี้โดยไม่กระพริบ">🔄 ซิงค์ทันที</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="d-flex justify-content-between align-items-center flex-wrap mt-2 pt-2 border-top">' +
              '<div id="teacherAutoSyncStatus" class="small text-muted">⚡ ระบบซิงค์อัตโนมัติพร้อมทำงาน</div>' +
              '<div class="d-flex gap-2 align-items-center">' +
                '<span id="teacherPendingCountBadge" class="badge bg-danger px-3 py-1"></span>' +
                '<span id="teacherGroupCountBadge" class="badge bg-success px-3 py-1"></span>' +
              '</div>' +
            '</div>';
          container.parentNode.insertBefore(filterBar, container);
          restartAutoSyncTimer();
        }

        var allGroups = cachedDashboardResponse.groups || [];
        var roomSet = {};

        allGroups.forEach(function(g) {
          var rm = (g.members && g.members[0] && g.members[0].room) ? String(g.members[0].room).trim() : 'ไม่ระบุห้อง';
          roomSet[rm] = (roomSet[rm] || 0) + 1;
        });
        var sortedRooms = Object.keys(roomSet).sort();

        var selectEl = document.getElementById('teacherRoomSelect');
        if (selectEl) {
          var currentVal = selectedTeacherRoom;
          selectEl.innerHTML = '<option value="ALL">📌 แสดงทุกห้องเรียน (รวมทั้งหมด ' + allGroups.length + ' กลุ่ม)</option>';
          sortedRooms.forEach(function(rm) {
            var sel = (rm === currentVal) ? ' selected' : '';
            selectEl.innerHTML += '<option value="' + rm + '"' + sel + '>ห้อง ' + rm + ' (' + roomSet[rm] + ' กลุ่ม)</option>';
          });
        }

        var statusSelectEl = document.getElementById('teacherStatusSelect');
        if (statusSelectEl) statusSelectEl.value = selectedStatusFilter;

        var syncSelectEl = document.getElementById('teacherAutoSyncSelect');
        if (syncSelectEl) syncSelectEl.value = String(autoSyncIntervalSec);

        var filteredGroups = (selectedTeacherRoom === 'ALL')
          ? allGroups.slice()
          : allGroups.filter(function(g) {
              var rm = (g.members && g.members[0] && g.members[0].room) ? String(g.members[0].room).trim() : 'ไม่ระบุห้อง';
              return rm === selectedTeacherRoom;
            });

        if (selectedStatusFilter === 'PENDING_ONLY') {
          filteredGroups = filteredGroups.filter(function(g) {
            return getPendingStepNumbers(g).length > 0;
          });
        }

        filteredGroups.sort(function(a, b) {
          var prioA = getGroupSortPriority(a);
          var prioB = getGroupSortPriority(b);
          if (prioA !== prioB) return prioA - prioB;
          var idA = String(a.groupId || '');
          var idB = String(b.groupId || '');
          return idA.localeCompare(idB, 'th', { numeric: true });
        });

        var pendingInFiltered = filteredGroups.filter(function(g) {
          return getPendingStepNumbers(g).length > 0;
        }).length;

        var pendingBadgeEl = document.getElementById('teacherPendingCountBadge');
        if (pendingBadgeEl) {
          if (pendingInFiltered > 0) {
            pendingBadgeEl.className = 'badge bg-danger px-3 py-2 shadow-sm';
            pendingBadgeEl.innerText = '🔔 รอครูตรวจ ' + pendingInFiltered + ' กลุ่ม';
          } else {
            pendingBadgeEl.className = 'badge bg-secondary px-3 py-2';
            pendingBadgeEl.innerText = '✅ ไม่มีงานค้างตรวจ';
          }
        }

        var badgeEl = document.getElementById('teacherGroupCountBadge');
        if (badgeEl) {
          badgeEl.innerText = 'แสดง ' + filteredGroups.length + ' / ' + allGroups.length + ' กลุ่ม';
        }

        var filteredRes = Object.assign({}, cachedDashboardResponse, { groups: filteredGroups });
        originalRenderTeacherData(filteredRes);

        if (container) {
          var cards = container.querySelectorAll('.group-review-card');
          cards.forEach(function(card, idx) {
            var grp = filteredGroups[idx];
            if (!grp) return;
            var pendingNums = getPendingStepNumbers(grp);
            if (pendingNums.length > 0) {
              card.style.border = '2px solid #dc3545';
              var headerEl = card.querySelector('.card-header');
              if (headerEl) {
                var alertBadge = document.createElement('div');
                alertBadge.className = 'mt-2';
                alertBadge.innerHTML = '<span class="badge bg-danger text-white fs-6 px-3 py-1 shadow-sm">⏳ รอครูตรวจสอบ: ปุ่มที่ ' + pendingNums.join(', ') + '</span>';
                var firstDiv = headerEl.querySelector('div');
                if (firstDiv) firstDiv.appendChild(alertBadge);
              }
            }
          });

          var imgs = container.querySelectorAll('img');
          imgs.forEach(function(img) {
            img.setAttribute('loading', 'lazy');
          });
        }

        updateSyncStatusText('⚡ ซิงค์ข้อมูลล่าสุดเมื่อ ' + formatTimeNow(), false);
        restoreCurrentUIState(savedUI, keepScrollPosition !== false);
      };
    }

    window.onTeacherRoomFilterChange = function(newRoomVal) {
      selectedTeacherRoom = newRoomVal || 'ALL';
      if (cachedDashboardResponse) {
        window.renderTeacherData(cachedDashboardResponse, false);
      }
    };

    window.onTeacherStatusFilterChange = function(newStatusVal) {
      selectedStatusFilter = newStatusVal || 'ALL';
      if (cachedDashboardResponse) {
        window.renderTeacherData(cachedDashboardResponse, false);
      }
    };

    window.onTeacherAutoSyncChange = function(secVal) {
      autoSyncIntervalSec = Number(secVal) || 0;
      restartAutoSyncTimer();
      if (autoSyncIntervalSec > 0) {
        updateSyncStatusText('⚡ ตั้งค่าซิงค์อัตโนมัติทุก ' + autoSyncIntervalSec + ' วินาที', true);
      } else {
        updateSyncStatusText('⏸️ ปิดการซิงค์อัตโนมัติชั่วคราว', false);
      }
    };
  })();
</script>
